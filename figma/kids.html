<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>子どもプロフィール | コドモ週末ナビ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="/css/home.css">
  <style>
    .wrap{max-width:760px;margin:18px auto 90px;padding:0 16px}
    .title-top{font-weight:800;font-size:20px;margin:10px 0 14px}
    .card-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
    .field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:#fff}
    .label{font-weight:700;margin:12px 0 8px;display:block}
    .pill-group{display:flex;gap:8px;flex-wrap:wrap}
    .pill{background:#f0f3f8;border:1px solid #d7dce6;border-radius:999px;font-size:12px;padding:8px 12px;color:#111827;font-weight:600;cursor:pointer}
    .pill.active{background:#eaf5ff;border-color:#7cc3ff}
    .btn-primary{display:block;width:100%;margin-top:16px;background:#2563eb;color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:700}
  </style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand">コドモ週末ナビ<span class="sub">子どもプロフィール</span></div>
      <a class="profile-btn" href="/profile">プロフィール</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="title-top">子供プロフィール</div>
  <div class="card-form">
    <label class="label">名前</label>
    <input id="kidName" class="field" placeholder="はると">

    <label class="label">年齢</label>
    <input id="kidAge" class="field" type="number" min="0" max="12" placeholder="4">

    <label class="label">好きなこと</label>
    <div id="likes" class="pill-group" data-key="likes">
      <button class="pill" data-value="恐竜">恐竜</button>
      <button class="pill" data-value="乗り物">乗り物</button>
      <button class="pill" data-value="水遊び">水遊び</button>
      <button class="pill" data-value="科学">科学</button>
      <button class="pill" data-value="動物">動物</button>
      <button class="pill" data-value="アート">アート</button>
      <button class="pill" data-value="スポーツ">スポーツ</button>
      <button class="pill" data-value="音楽">音楽</button>
    </div>

    <label class="label">苦手なこと</label>
    <div id="dislikes" class="pill-group" data-key="dislikes">
      <button class="pill" data-value="大きな音">大きな音</button>
      <button class="pill" data-value="寒さ">寒さ</button>
      <button class="pill" data-value="日差し">日差し</button>
      <button class="pill" data-value="混雑">混雑</button>
      <button class="pill" data-value="高い場所">高い場所</button>
    </div>

    <button id="saveBtn" class="btn-primary">保存</button>
  </div>
</main>

<nav class="tabbar">
  <a class="tab" href="/"><i class="fa-solid fa-house"></i><span>ホーム</span></a>
  <a class="tab" href="/search"><i class="fa-solid fa-magnifying-glass"></i><span>検索</span></a>
  <a class="tab" href="/favorites"><i class="fa-regular fa-heart"></i><span>お気に入り</span></a>
  <a class="tab" href="/schedule"><i class="fa-regular fa-calendar"></i><span>スケジュール</span></a>
  <a class="tab" href="/kids"><i class="fa-regular fa-user"></i><span>設定</span></a>
  <a class="tab" href="/profile"><i class="fa-solid fa-robot"></i><span>キッド</span></a>
  <a class="tab logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>ログアウト</span></a>
</nav>

<script src="/js/kids.js"></script>
</body>
</html>
