<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>スポット詳細 | コドモ週末ナビ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="/css/home.css">
  <style>
    .wrap{max-width:1100px;margin:10px auto 90px;padding:0 16px}
    .crumb{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
    .crumb a{color:#2563eb;text-decoration:none;font-weight:600}
    .hero-img{width:100%;height:380px;border-radius:12px;overflow:hidden;background:#e5e7eb}
    .hero-img img{width:100%;height:100%;object-fit:cover;display:block}
    .title-row{display:flex;align-items:center;gap:10px;margin-top:14px}
    .op-row{display:flex;gap:10px;margin:14px 0}
    .btn{border-radius:12px;padding:10px 14px;font-weight:700;border:1px solid #e5e7eb;background:#fff;cursor:pointer}
    .btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}
    .pilltab{display:flex;gap:10px;margin:6px 0 12px}
    .pilltab .tabb{padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;font-weight:700}
    .sect{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}
    .row{display:flex;gap:12px;color:#64748b;font-size:13px}
    .row .m i{margin-right:6px}
    .hr{height:1px;background:#e5e7eb;margin:10px 0}
    .sched-head{display:flex;justify-content:space-between;align-items:center}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;font-size:14px;background:#fff}
    .reviews .item{border-top:1px solid #e5e7eb;padding:10px 0}
    .muted{color:#64748b}
    .taglist{display:flex;gap:8px;flex-wrap:wrap}
    .ghost{background:#fff;border:1px solid #e5e7eb;color:#333}
    .ghost:hover{background:#f1f5f9}
  </style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand">コドモ週末ナビ<span class="sub">スポットの詳細</span></div>
      <a class="profile-btn" href="/profile">プロフィール</a>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- breadcrumb & title -->
  <div class="crumb">
    <a href="javascript:history.back()"><i class="fa-solid fa-angle-left"></i> 戻る</a>
    <span id="crumbName" class="muted"></span>
  </div>

  <!-- hero -->
  <div class="hero-img"><img id="heroImg" src="" alt=""></div>

  <!-- title -->
  <div class="title-row">
    <h2 id="spotName" class="title" style="font-size:20px;margin:0"></h2>
    <div id="badgeStack" class="badge-stack" style="position:static"></div>
  </div>

  <!-- meta & pill -->
  <div class="row" id="metaRow" style="margin-top:6px"></div>
  <div class="pilltab">
    <span class="tabb" id="ageTypePrice"></span>
  </div>

  <!-- actions -->
  <div class="op-row">
    <button id="btnRoute" class="btn"><i class="fa-solid fa-location-arrow"></i> 経路</button>
    <button id="btnFav" class="btn ghost"><i class="fa-regular fa-heart"></i> 保存</button>
    <button id="btnOpenSched" class="btn"><i class="fa-regular fa-calendar"></i> 追加</button>
  </div>

  <!-- schedule panel -->
  <div id="schedPanel" class="sect" style="display:none">
    <div class="sched-head">
      <strong>スケジュールに追加</strong>
      <button id="btnCloseSched" class="btn">閉じる</button>
    </div>
    <div class="hr"></div>
    <div class="grid2">
      <input id="date" type="date" class="field">
      <input id="time" type="time" class="field" value="10:00">
    </div>
    <div style="margin-top:10px"><input id="note" class="field" placeholder="メモ(任意)"></div>
    <div style="margin-top:10px;display:flex;gap:10px">
      <button id="btnCancelSched" class="btn">キャンセル</button>
      <button id="btnSaveSched" class="btn primary">保存する</button>
    </div>
  </div>

  <!-- details -->
  <div class="sect">
    <strong>施設について</strong>
    <div id="desc" style="margin-top:8px"></div>
  </div>

  <div class="sect">
    <strong>営業時間</strong>
    <div id="hours" style="margin-top:8px"></div>
  </div>

  <div class="sect">
    <strong>設備</strong>
    <div id="facilities" class="taglist" style="margin-top:8px"></div>
  </div>

  <div class="sect">
    <strong>安全メモ</strong>
    <ul id="safety" style="margin-top:8px;padding-left:20px"></ul>
  </div>

  <div class="sect">
    <strong>タグ</strong>
    <div id="tags" class="taglist" style="margin-top:8px"></div>
  </div>

  <!-- reviews -->
  <div class="sect reviews">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>レビュー</strong>
      <button id="btnPostReview" class="btn">投稿する</button>
    </div>
    <div id="reviewList"></div>
  </div>
</div>

<!-- tabbar -->
<nav class="tabbar">
  <a class="tab" href="/"><i class="fa-solid fa-house"></i><span>ホーム</span></a>
  <a class="tab" href="/search"><i class="fa-solid fa-magnifying-glass"></i><span>検索</span></a>
  <a class="tab" href="/favorites"><i class="fa-regular fa-heart"></i><span>お気に入り</span></a>
  <a class="tab" href="/schedule"><i class="fa-regular fa-calendar"></i><span>スケジュール</span></a>
  <a class="tab" href="/kids"><i class="fa-regular fa-user"></i><span>設定</span></a>
  <a class="tab" href="/profile"><i class="fa-solid fa-robot"></i><span>キッド</span></a>
  <a class="tab logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>ログアウト</span></a>
</nav>

<script src="/js/spot.js"></script>
</body>
</html>
